<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>منصة العمل</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- شاشة التحميل -->
  <div id="loadingScreen" class="loading">جارٍ التحميل…</div>

  <!-- شاشة الدخول -->
  <div id="loginScreen" class="auth hide">
    <form id="loginForm" class="card">
      <div class="logo">م</div>
      <h1>منصة العمل</h1>
      <p class="sub">سجّل دخولك للمتابعة</p>

      <label for="username">اسم المستخدم</label>
      <input id="username" autocomplete="username" required>

      <label for="password">كلمة المرور</label>
      <input id="password" type="password" autocomplete="current-password" required>

      <div id="loginError" class="error"></div>
      <button id="loginBtn" class="btn primary" type="submit">دخول</button>
    </form>
  </div>

  <!-- الواجهة الرئيسية -->
  <div id="appScreen" class="hide">
    <header class="topbar">
      <div class="brand"><span class="logo">م</span>منصة العمل</div>
      <div class="who"><b id="userName"></b><small id="userRole"></small></div>
      <button id="logoutBtn" class="btn">خروج</button>
    </header>

    <main>
      <!-- ===== أوامر الشراء ===== -->
      <div class="page-head">
        <div>
          <h1>أوامر الشراء</h1>
          <p class="sub">إدخال ومتابعة أوامر الشراء واعتمادها.</p>
        </div>
        <div class="actions">
          <button id="refreshBtn" class="btn">تحديث</button>
          <button id="newOrderBtn" class="btn primary">+ أمر شراء جديد</button>
        </div>
      </div>

      <div id="stats" class="stats"></div>

      <div class="card">
        <div class="toolbar">
          <input id="search" placeholder="ابحث برقم الأمر أو المورد أو الموديل">
          <select id="filterDept"></select>
          <select id="filterStatus">
            <option value="">كل الحالات</option>
            <option>معتمد</option>
            <option>بانتظار الاعتماد</option>
          </select>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>رقم الأمر</th><th>التاريخ</th><th>القسم</th><th>المورد</th>
                <th>البنود</th><th>الكمية</th><th>الحاويات</th><th>القيمة</th><th>الحالة</th>
              </tr>
            </thead>
            <tbody id="ordersBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- ===== نافذة أمر الشراء (إضافة / عرض / تعديل) ===== -->
  <dialog id="orderDialog">
    <form id="orderForm">
      <div class="dlg-head">
        <h2 id="dlgTitle"></h2>
        <span id="dlgStatus"></span>
        <button type="button" class="btn" data-close>إغلاق</button>
      </div>

      <div class="dlg-body">
        <div class="grid">
          <div><label for="f_poNo">رقم الأمر *</label><input id="f_poNo" required placeholder="PO-2026-001"></div>
          <div><label for="f_date">تاريخ الأمر *</label><input id="f_date" type="date" required></div>
          <div><label for="f_department">القسم *</label><select id="f_department" required></select></div>
          <div><label for="f_supplier">المورد / المصنع *</label><input id="f_supplier" required></div>
          <div>
            <label for="f_currency">العملة</label>
            <select id="f_currency"><option>USD</option><option>CNY</option><option>SAR</option><option>EUR</option></select>
          </div>
          <div>
            <label for="f_incoterm">شرط التسليم</label>
            <select id="f_incoterm"><option>FOB</option><option>CFR</option><option>CIF</option><option>EXW</option><option>DDP</option></select>
          </div>
          <div>
            <label for="f_payMethod">طريقة الدفع</label>
            <select id="f_payMethod"><option>T/T</option><option>L/C</option><option>D/P</option></select>
          </div>
          <div><label for="f_depositPct">الدفعة المقدمة %</label><input id="f_depositPct" type="number" min="0" max="100" step="any" placeholder="30"></div>
          <div class="wide"><label for="f_notes">ملاحظات</label><input id="f_notes"></div>
        </div>

        <div class="items-head">
          <h3>البنود</h3>
          <button type="button" id="addItemBtn" class="btn small">+ إضافة بند</button>
        </div>
        <div class="table-wrap">
          <table class="items">
            <thead>
              <tr><th>الموديل *</th><th>الوصف</th><th>الكمية *</th><th>سعر الوحدة</th><th>الحاويات</th><th>القيمة</th><th></th></tr>
            </thead>
            <tbody id="itemsBody"></tbody>
          </table>
        </div>

        <div class="totals">
          <div><span>إجمالي الكمية</span><b id="totQty">0</b></div>
          <div><span>إجمالي الحاويات</span><b id="totCnt">0</b></div>
          <div class="grand"><span>قيمة الأمر</span><b id="totVal">0</b></div>
        </div>
        <p id="dlgMeta" class="meta"></p>
      </div>

      <div class="dlg-foot">
        <div id="formError" class="error"></div>
        <button type="button" id="deleteBtn" class="btn danger">حذف</button>
        <button type="button" id="approveBtn" class="btn">اعتماد الأمر</button>
        <button type="submit" id="saveBtn" class="btn primary">حفظ</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status"></div>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
